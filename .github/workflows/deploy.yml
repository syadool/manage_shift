name: Deploy

# main に入った変更を manageshift.fun に公開する。
# 必要な設定 (GitHub のリポジトリ設定 → Secrets and variables → Actions):
#   Secret CLOUDFLARE_API_TOKEN: Workers Scripts / D1 / Workers R2 Storage / Account Settings (Account)、
#                                Workers Routes / DNS (Zone: manageshift.fun) の権限を持つトークン
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 公開は1つずつ順番に行う (途中で止めない)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 型やテストが通らない変更は公開しない
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply manage-shift-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://manageshift.fun/api/health) && [ "$code" = "200" ] && echo "health: $code" && exit 0
            echo "health: $code (retry $i)"; sleep 10
          done
          exit 1
